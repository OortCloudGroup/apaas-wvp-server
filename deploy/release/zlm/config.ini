[api]
secret=change-me-zlm-secret

[general]
mediaServerId=zlmediakit-local

[http]
port=8080
sslport=8443
allow_cross_domains=1

[rtp]
port_range=40000-40300

[hook]
enable=1
alive_interval=10
on_play=http://__ZLM_HOOK_HOST__:8080/index/hook/on_play
on_publish=http://__ZLM_HOOK_HOST__:8080/index/hook/on_publish
on_server_started=http://__ZLM_HOOK_HOST__:8080/index/hook/on_server_started
on_server_keepalive=http://__ZLM_HOOK_HOST__:8080/index/hook/on_server_keepalive
on_stream_changed=http://__ZLM_HOOK_HOST__:8080/index/hook/on_stream_changed
on_stream_none_reader=http://__ZLM_HOOK_HOST__:8080/index/hook/on_stream_none_reader
on_stream_not_found=http://__ZLM_HOOK_HOST__:8080/index/hook/on_stream_not_found
on_send_rtp_stopped=http://__ZLM_HOOK_HOST__:8080/index/hook/on_send_rtp_stopped
on_rtp_server_timeout=http://__ZLM_HOOK_HOST__:8080/index/hook/on_rtp_server_timeout
on_record_mp4=http://__ZLM_HOOK_HOST__:8080/index/hook/on_record_mp4
